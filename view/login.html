<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Olympe - Acesso</title>
</head>
<body class="pagina-login">
    <main id="conteudo-login">
            <img src="../img/login.jpg" alt="Ilustração do projeto Olympe for Safe">
        <div id="formulario-login">
        <h1 class="titulo-formulario">Olympe</h1>
        <p class="texto-formulario">Entre com sua conta do app para acessar a plataforma.</p>

        <form action="https://olympe-api.onrender.com/api/login" method="POST" id="form-login">
            <label for="email">Email:</label> <br> <br>
            <input type="email" id="email" name="email" 
            placeholder="Digite seu e-mail" required> <br> <br>
            
            <label for="senha">Senha:</label> <br> <br>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                required
            > <br> <br>

            <div>
                <button type="submit">ENTRAR</button>

            
                <a class="link-esqueceu-senha" href="recuperar-senha.html">
                    Esqueceu sua senha?
                </a>
            </div>

        </form>
        </div>
    </main>
    <script src="../js/login.js"></script>
</body>
</html>
