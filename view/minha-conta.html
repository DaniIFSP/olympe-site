
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Minha conta - Olympe</title>
</head>

<body class="pagina-conta">

    <header class="cabecalho-conta">
        <a href="../index.html" class="logo-conta">
            OLYMPE FOR SAFE
        </a>

        <a href="../index.html" class="voltar-conta">
            Voltar ao início
        </a>
    </header>

    <main class="conteudo-conta">

        <section class="card-conta">

            <h1>Minha conta</h1>

            <p class="descricao-conta">
                Consulte seus dados pessoais.
            </p>

            <div id="mensagem-conta" role="status"></div>

            <!-- VISUALIZAÇÃO DOS DADOS -->
            <div id="visualizacao-conta" hidden>

                <div class="dados-conta">
                    <div class="item-dado">
                        <strong>Nome completo</strong>
                        <p id="visual-nome"></p>
                    </div>

                    <div class="item-dado">
                        <strong>E-mail</strong>
                        <p id="visual-email"></p>
                    </div>

                    <div class="item-dado">
                        <strong>Telefone</strong>
                        <p id="visual-telefone"></p>
                    </div>
                </div>

                <button type="button" id="btn-editar-conta">
                    Editar dados
                </button>

            </div>

            <!-- FORMULÁRIO DE EDIÇÃO -->
            <form id="form-conta" hidden>

                <div class="campo-conta">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required
                        maxlength="90"
                    >
                </div>

                <div class="campo-conta">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        maxlength="90"
                    >
                </div>

                <div class="campo-conta">
                    <label for="telefone">Telefone</label>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        required
                        maxlength="20"
                        placeholder="+5511999999999"
                    >
                    <small>
                        Utilize o formato internacional, incluindo o código do país.
                    </small>
                </div>

                <div class="botoes-conta">
                    <button type="submit" id="btn-salvar-conta">
                        Salvar alterações
                    </button>

                    <button type="button" id="btn-cancelar-edicao">
                        Cancelar
                    </button>
                </div>

            </form>

        </section>

    </main>

    <script src="../js/auth.js"></script>
    <script src="../js/minha-conta.js"></script>

</body>
</html>
