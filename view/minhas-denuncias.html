
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consultar relato | Olympe for Safe</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="pagina-denuncias">

    <header class="cabecalho-denuncias">
        <a href="../index.html" class="logo-denuncias">
            Olympe for Safe
        </a>

        <nav>
            <a href="../index.html">Voltar à área inicial</a>
        </nav>
    </header>

    <main class="conteudo-denuncias">

        <section class="introducao-denuncias">
            <span class="subtitulo-denuncias">
                ACOMPANHAMENTO ANÔNIMO
            </span>

            <h1>Consultar relato</h1>

            <p>
                Informe o protocolo e o código de acesso
                recebidos por e-mail para acompanhar
                o andamento do seu relato.
            </p>
        </section>

        <section class="lista-denuncias">

            <div class="titulo-lista-denuncias">
                <h2>Acessar relato</h2>
            </div>

            <form id="form-consultar-denuncia">

                <div class="campo-formulario">
                    <label for="protocolo">
                        Protocolo
                    </label>

                    <input
                        type="text"
                        id="protocolo"
                        name="protocolo"
                        placeholder="Ex.: OLY-K8M3PX7A"
                        maxlength="20"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="codigo_acesso">
                        Código de acesso
                    </label>

                    <input
                        type="text"
                        id="codigo_acesso"
                        name="codigo_acesso"
                        placeholder="Digite seu código de acesso"
                        maxlength="20"
                        required
                    >
                </div>

                <button
                    type="submit"
                    id="btn-consultar-denuncia"
                >
                    CONSULTAR RELATO
                </button>

            </form>

            <div
                id="resultado-consulta"
                hidden
            ></div>

        </section>

    </main>

    <script src="../js/minhas-denuncias.js"></script>

</body>
</html>
